name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine-2048:
    name: 2048 engine tests (C++17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test
        working-directory: 01-2048-webassembly-game

  minesweeper:
    name: Minesweeper typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-react-native-minesweeper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 02-react-native-minesweeper/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle the app (Metro smoke test)
        run: npx expo export --platform web --output-dir /tmp/ms-export

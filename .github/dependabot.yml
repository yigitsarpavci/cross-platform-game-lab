# Monthly dependency and GitHub Actions updates, grouped to keep PR noise low.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/02-react-native-minesweeper"
    schedule:
      interval: "monthly"
    # Minor/patch updates arrive automatically; major versions are migrations done deliberately.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3
    groups:
      all-updates:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      all-updates:
        patterns: ["*"]
